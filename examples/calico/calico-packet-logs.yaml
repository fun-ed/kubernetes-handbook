# Requires Calico 3.33.0 and a node log path containing Calico's iptables logs.
# Source CRD: https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/v3_projectcalico_org.yaml
# Opt-in demo policy: Allow rules affect only endpoints explicitly labeled packet-log-demo.
# Run only in a disposable cluster; the log collector reads node logs via hostPath.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: calico-log
spec:
  selector: has(packet-log-demo)
  egress:
  - action: Log
    destination: {}
    protocol: TCP
    source: {}
  - action: Log
    destination: {}
    protocol: UDP
    source: {}
  - action: Allow
  ingress:
  - action: Log
    destination: {}
    protocol: TCP
    source: {}
  - action: Log
    destination: {}
    protocol: UDP
    source: {}
  - action: Allow
  types:
  - Ingress
  - Egress
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: "calico-packet-logs"
  namespace: "default"
spec:
  selector:
    matchLabels:
      app: "calico-packet-logs"
  template:
    metadata:
      labels:
        app: "calico-packet-logs"
    spec:
      containers:
        - name: "calico-packet-logs"
          image: alpine:3.24.2
          command:
            - sh
            - -c
            - tail -f /var/log/syslog | grep 'calico-packet:'
          volumeMounts:
            - name: "iptables-logs"
              mountPath: "/var/log"
              readOnly: true
      volumes:
        - name: "iptables-logs"
          hostPath:
            path: "/var/log"
      nodeSelector:
        kubernetes.io/os: linux