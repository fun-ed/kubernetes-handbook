# Replace the placeholder image and create `myregistrykey` in this namespace.
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: registry.example.com/nginx:1.30.5
    ports:
    - containerPort: 80
  imagePullSecrets:
    - name: myregistrykey
