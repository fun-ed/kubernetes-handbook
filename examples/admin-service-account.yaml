# HIGH PRIVILEGE: this ClusterRole grants effective cluster-admin access.
# Use only in a disposable cluster, and prefer a least-privilege role.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-user
rules:
  - apiGroups:
      - "*"
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-user
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: default
