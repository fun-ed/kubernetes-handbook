# HISTORICAL: The bundled atuvenie/mounttest:1.0 image was last pushed in 2018 and contains Windows base version 10.0.17134.48; it is not a current Kubernetes Windows-node image.
# See the official projected-volume concept: https://kubernetes.io/docs/concepts/storage/projected-volumes
# For Windows container/node version compatibility, see: https://kubernetes.io/docs/concepts/windows/intro/
# Requires the custom `atuvenie/mounttest:1.0` image and a compatible node OS.
apiVersion: v1
kind: Pod
metadata:
  name: mount-projected-volume
spec:
  containers:
  - name: mount-projected-volume
    image: atuvenie/mounttest:1.0
    args: [--file_content=/projected-volume/new/path/data-1]
    volumeMounts:
    - name: all-in-one
      mountPath: /projected-volume
      readOnly: true
  volumes:
  - name: all-in-one
    projected:
      sources:
      - secret:
          name: my-special-secret
          items:
            - key: data-1
              path: new/path/data-1
---
apiVersion: v1
kind: Secret
metadata:
  name: my-special-secret
type: Opaque
data:
  data-1: aGVsbG8gdGhlcmUh

