# HISTORICAL: Service for the retired Elasticsearch 5.6 logging stack.
# 历史配置：此 Service 属于已归档的 Elasticsearch 5.6 堆栈，不适用于当前日志平台。
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-logging
  namespace: kube-system
  labels:
    k8s-app: elasticsearch-logging
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: EnsureExists
    kubernetes.io/name: "Elasticsearch"
spec:
  ports:
  - port: 9200
    protocol: TCP
    targetPort: db
  selector:
    k8s-app: elasticsearch-logging
