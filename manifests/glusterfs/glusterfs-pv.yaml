# HISTORICAL: PersistentVolume for the removed in-tree GlusterFS volume plugin.
# 历史配置：GlusterFS in-tree 卷插件已移除；当前存储应使用 CSI 驱动。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gluster-dev-volume
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteMany
  glusterfs:
    endpoints: "glusterfs-cluster"
    path: "k8s-volume"
    readOnly: false
