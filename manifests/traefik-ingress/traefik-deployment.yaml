# Source: Traefik v3.7.13 Kubernetes Gateway provider docs and official RBAC.
# The release documents Gateway API v1.6.1; v1.6.2 passed only a basic HTTP/HTTPS smoke test on kind Kubernetes v1.37.1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-controller
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik-controller
      terminationGracePeriodSeconds: 60
      containers:
      - name: traefik
        image: traefik:v3.7.13
        imagePullPolicy: IfNotPresent
        args:
        - --entrypoints.web.address=:80/tcp
        - --entrypoints.websecure.address=:443/tcp
        - --ping=true
        - --providers.kubernetesgateway=true
        - --log.level=INFO
        ports:
        - name: traefik
          containerPort: 8080
          protocol: TCP
        - name: web
          containerPort: 80
          protocol: TCP
        - name: websecure
          containerPort: 443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ping
            port: traefik
            scheme: HTTP
        livenessProbe:
          httpGet:
            path: /ping
            port: traefik
            scheme: HTTP
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
  - name: web
    port: 80
    protocol: TCP
    targetPort: web
  - name: websecure
    port: 443
    protocol: TCP
    targetPort: websecure
  type: LoadBalancer
