# HISTORICAL: Ingress-NGINX TLS example; controller is retired, so this file is not a current install path.
# 历史配置：此路由依赖已归档的 ingress-nginx。当前 TLS 示例见 ../../gateway-api/。
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: echoserver
  namespace: echoserver
  annotations:
    kubernetes.io/tls-acme: "true"
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - echo-tls.example.com
    secretName: echoserver-tls
  rules:
  - host: echo-tls.example.com
    http:
      paths:
      - path: /
        backend:
          serviceName: echoserver
          servicePort: 80
